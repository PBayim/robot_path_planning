obstacle_mover:
  ros__parameters:
    obstacle_names: ["moving_obstacle_1", "moving_obstacle_2"]
    update_rate_hz: 20.0

    moving_obstacle_1:
      waypoints_x: [-1.2, 1.6]
      waypoints_y: [0.4, 0.4]
      speed: 0.35
      z: 0.4
      phase_offset: 0.0

    moving_obstacle_2:
      waypoints_x: [0.6, 0.6]
      waypoints_y: [-1.6, 1.3]
      speed: 0.30
      z: 0.4
      phase_offset: 3.0
